services:
  caddy:
    container_name: caddy
    image: caddy:2.8.4
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./config/caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - intranet
      - loki
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push

volumes:
  caddy_data:
  caddy_config:


